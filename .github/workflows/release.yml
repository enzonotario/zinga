name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

env:
  GST_VERSION: 1.24.12

jobs:
  build-linux:
    name: Build linux-x64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm desktop:build
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libgst*;libglib-2.0.so*;libgobject-2.0.so*;libgio-2.0.so*;libgmodule-2.0.so*;libgthread-2.0.so*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zinga-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  build-windows:
    name: Build windows-x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pkg-config
        run: choco install pkgconfiglite --no-progress -y

      - name: Install GStreamer MSVC
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          $runtime = "$env:TEMP\gstreamer-runtime.msi"
          $devel = "$env:TEMP\gstreamer-devel.msi"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi" -OutFile $runtime
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi" -OutFile $devel
          Start-Process msiexec.exe -ArgumentList "/i `"$runtime`" /qn /norestart" -Wait
          Start-Process msiexec.exe -ArgumentList "/i `"$devel`" /qn /norestart" -Wait
          $gst = "C:\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path $gst)) {
            throw "GStreamer was not installed at $gst"
          }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$gst\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm desktop:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zinga-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe

  build-optional:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
          - name: macos-x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm desktop:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zinga-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-optional
    if: always() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find dist -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*.exe' \
          \) -print0 | while IFS= read -r -d '' file; do
            artifact="$(echo "$file" | cut -d / -f 2 | sed 's/^zinga-//')"
            case "$file" in
              *.AppImage) extension=AppImage ;;
              *.deb) extension=deb ;;
              *.rpm) extension=rpm ;;
              *.dmg) extension=dmg ;;
              *.msi) extension=msi ;;
              *.exe) extension=exe ;;
            esac
            cp "$file" "release-assets/Zinga-${artifact}.${extension}"
          done
          ls -la release-assets

      - name: Create GitHub release
        run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
