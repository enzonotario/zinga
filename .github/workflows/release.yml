name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-linux

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list || true
          fi
          if [ -d /etc/apt/sources.list.d ]; then
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/*.list 2>/dev/null || true
          fi
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          packages=(
            libunwind-dev
            libwebkit2gtk-4.1-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            patchelf
            pkg-config
            libssl-dev
            libgstreamer1.0-dev
            libgstreamer-plugins-base1.0-dev
          )
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get install -y -o Acquire::Retries=3 "${packages[@]}"; then
              exit 0
            fi
            echo "apt-get install failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm desktop:build
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libgst*;libglib-2.0.so*;libgobject-2.0.so*;libgio-2.0.so*;libgmodule-2.0.so*;libgthread-2.0.so*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zinga-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  build-windows:
    name: Build windows-x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm desktop:build
        env:
          # UPnP/ffmpeg path; local GStreamer playback is Linux-first until
          # a reliable Windows SDK mirror is available in CI.
          ZINGA_CARGO_ARGS: --no-default-features

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zinga-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-linux
      - build-windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find dist -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.exe' \
          \) -print0 | while IFS= read -r -d '' file; do
            artifact="$(echo "$file" | cut -d / -f 2 | sed 's/^zinga-//')"
            case "$file" in
              *.AppImage) extension=AppImage ;;
              *.deb) extension=deb ;;
              *.rpm) extension=rpm ;;
              *.exe) extension=exe ;;
            esac
            cp "$file" "release-assets/Zinga-${artifact}.${extension}"
          done
          ls -la release-assets

      - name: Create GitHub release
        run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
