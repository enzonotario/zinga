[package]
name = "zinga"
version = "0.0.5"
description = "Music app for UPnP devices, built with Nuxt 4 and Tauri 2"
authors = [ "Enzo Notario" ]
license = "MIT"
repository = "https://github.com/enzonotario/zinga"
edition = "2021"

[lib]
name = "zinga_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.5"
features = [ ]

[features]
default = [ "local-player" ]
local-player = [ "dep:gstreamer" ]

[dependencies]
serde_json = "1"
ureq = "3.1.1"
quick-xml = "0.38.3"
url = "2.5.7"
urlencoding = "2.1.3"
rand = "0.8"
hostname = "0.4"
futures-util = "0.3"
gstreamer = { version = "0.23.4", package = "gstreamer", optional = true }
lofty = "0.22.0"
walkdir = "2.5.0"
base64 = "0.22.1"
if-addrs = "0.14"
sha2 = "0.10"
sha1 = "0.10"
portable-pty = "0.9.0"
ytmapi-rs = { version = "0.3.3", default-features = false, features = [
  "native-tls",
  "simplified-queries",
  "reqwest"
] }
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "json",
  "stream"
] }
zip = { version = "2.6.1", default-features = false, features = [ "deflate" ] }
image = { version = "0.25", default-features = false, features = [ "jpeg" ] }

[dependencies.axum]
version = "0.8"
features = [ "ws" ]

[dependencies.tower-http]
version = "0.6"
features = [
  "cors",
  "fs"
]

[dependencies.uuid]
version = "1"
features = [ "v4" ]

[dependencies.tokio]
version = "1"
features = [ "full" ]

[dependencies.tauri]
version = "2.9"
features = [
  "protocol-asset",
  "tray-icon",
  "image-png",
  "unstable"
]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[dependencies.tauri-plugin-shell]
version = "2"

[dependencies.tauri-plugin-opener]
version = "2"

[dependencies.tauri-plugin-dialog]
version = "2"

[dependencies.tauri-plugin-sql]
version = "2"
features = [ "sqlite" ]

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gtk = { version = "0.18", features = [ "v3_24" ] }
webkit2gtk = { version = "=2.0.1", features = [ "v2_38" ] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.3.4"
